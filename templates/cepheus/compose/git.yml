networks:
  web:

services:
  gitea:
    container_name: gitea
    image: gitea/gitea:latest
    restart: unless-stopped

    networks:
      web:

    environment:
      USER_UID: 4002
      USER_GID: 4002
      GITEA__SERVER__ROOT_URL: https://git.{{ primary_domain }}
      GITEA__SERVICE__DISABLE_REGISTRATION: true
      GITEA__INDEXER__REPO_INDEXER_ENABLED: true
      GITEA__ACTIONS__ENABLED: true

    volumes:
      - "{{ app_root }}/gitea/data:/data"
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    ports:
      - "1108:22"

    labels:
      traefik.enable: true
      traefik.http.routers.git.rule: Host(`git.{{ primary_domain }}`)
      traefik.http.routers.git.tls.certresolver: default
      traefik.http.services.git.loadbalancer.server.port: 80
      # traefik.http.routers.git.middlewares: authelia
      homepage.group: Apps
      homepage.name: Git hosting
      homepage.icon: gitea.png
      homepage.href: https://git.{{ primary_domain }}/
      homepage.description: Gitea
      homepage.siteMonitor: http://gitea
      homepage.weight: 50

  gitea-runner:
    container_name: gitea-runner
    image: gitea/runner:latest-dind
    restart: unless-stopped

    # dind runs its own Docker daemon for jobs
    privileged: true

    env_file: git.env
    environment:
      GITEA_INSTANCE_URL: https://git.{{ primary_domain }}
      GITEA_RUNNER_NAME: roger-bannister
      GITEA_RUNNER_LABELS: ubuntu-latest:docker://docker.gitea.com/runner-images:ubuntu-latest

    volumes:
      - "{{ app_root }}/gitea/runner:/data"
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

