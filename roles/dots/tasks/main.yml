---
- name: Install packages
  tags: dots
  package:
    name:
      - git
      - stow
      - starship

- name: Resolve user home directories
  tags: dots
  getent:
    database: passwd

- name: Set global git identity
  tags: dots
  become: true
  become_user: "{{ item[0] }}"
  community.general.git_config:
    name: "{{ conf.key }}"
    value: "{{ conf.value }}"
    scope: global
  loop: "{{ dots_users | product([{'key': 'user.name', 'value': 'subract'}, {'key': 'user.email', 'value': 'self@subract.dev'}]) }}"
  loop_control:
    label: "{{ item[0] }}: {{ item[1].key }}"
  vars:
    conf: "{{ item[1] }}"

- name: Use credential store for github.com
  tags: dots
  become: true
  become_user: "{{ item }}"
  community.general.git_config:
    name: credential.https://github.com.helper
    value: store
    scope: global
  loop: "{{ dots_users }}"

- name: Store GitHub dotfiles PAT
  tags: dots
  become: true
  no_log: true
  copy:
    content: "https://subract:{{ github_dotfiles_pat }}@github.com\n"
    dest: "{{ ansible_facts.getent_passwd[item][4] }}/.git-credentials"
    mode: "0600"
    owner: "{{ item }}"
    group: "{{ item }}"
  loop: "{{ dots_users }}"

- name: Clone dotfiles
  tags: dots
  become: true
  become_user: "{{ item }}"
  git:
    repo: https://github.com/subract/dotfiles.git
    dest: "{{ ansible_facts.getent_passwd[item][4] }}/.dotfiles"
  loop: "{{ dots_users }}"
  register: dots_clone
  failed_when: false

- name: Warn if dotfiles clone/pull failed
  tags: dots
  when: item.failed | default(false)
  debug:
    msg: >-
      WARNING: Could not clone/pull dotfiles at {{ item.dest }}
      (local changes?). Skipping; continuing playbook.
      Error: {{ item.msg | default('unknown') }}
  loop: "{{ dots_clone.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Stow dotfiles packages
  tags: dots
  become: true
  become_user: "{{ item[0] }}"
  command:
    cmd: "stow --dotfiles --dir={{ dots_home }}/.dotfiles --target={{ dots_home }} {{ item[1] }}"
  loop: "{{ dots_users | product(dots_stow_packages) }}"
  loop_control:
    label: "{{ item[0] }}: {{ item[1] }}"
  register: dots_stow
  changed_when: dots_stow.stdout != ''
  vars:
    dots_home: "{{ ansible_facts.getent_passwd[item[0]][4] }}"
