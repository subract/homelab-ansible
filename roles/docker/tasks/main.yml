---
- name: Set docker env vars/shortcuts
  tags: docker, config
  blockinfile:
    path: /etc/zsh/zshrc.local
    create: true
    mode: "0644"
    owner: root
    group: root
    block: |
      alias dc='docker compose $(find {{ compose_dir }} -maxdepth 1 -name "*.yml" | sed -e "s/^/-f /")'
      alias dcls="docker container ls"
      alias dcps="docker container ps"
      alias dcl="docker logs"
      alias dclf="docker logs --follow"
      alias dcsh='f() { docker exec -it "$1" bash || docker exec -it "$1" sh; }; f'

- name: Create compose directory
  tags: docker
  file:
    path: "{{ compose_dir }}"
    state: directory
    mode: "0770"
    owner: root
    group: docker

# If an app name was specified, only copy its files
# Otherwise, copy all files

- name: Update all compose files
  tags: docker, compose
  when: app is undefined
  block:
    - name: Copy all compose files
      tags: docker, compose
      template:
        src: "{{ item }}"
        dest: "{{ compose_dir }}/{{ item | basename }}"
        mode: "0660"
        owner: root
        group: docker
      with_fileglob:
        - ../templates/{{ inventory_hostname }}/compose/*.yml

    - name: Remove compose files disabled locally
      tags: docker, compose
      file:
        path: "{{ compose_dir }}/{{ item | basename | regex_replace('\\.disable$', '') }}"
        state: absent
      with_fileglob:
        - ../templates/{{ inventory_hostname }}/compose/*.yml.disable

    - name: Copy all .env files
      tags: docker, compose, env
      copy:
        src: "{{ item }}"
        dest: "{{ compose_dir }}/{{ item | basename }}"
        mode: "0440"
        owner: root
        group: docker
      with_fileglob:
        - ../files/{{ inventory_hostname }}/docker_env/*.env

- name: Update one compose files
  tags: docker, compose
  when: app is defined
  block:
    - name: Copy one compose file
      tags: docker, compose
      template:
        src: "templates/{{ inventory_hostname }}/compose/{{ app }}.yml"
        dest: "{{ compose_dir }}/{{ app }}.yml"
        mode: "0660"
        owner: root
        group: docker

    - name: Check for app env file
      tags: docker, compose
      delegate_to: localhost
      become: false
      stat:
        path: "files/{{ inventory_hostname }}/docker_env/{{ app }}.env"
      register: docker_env_file

    - name: Copy one env file
      tags: docker, compose
      template:
        src: "files/{{ inventory_hostname }}/docker_env/{{ app }}.env"
        dest: "{{ compose_dir }}/{{ app }}.env"
        mode: "0440"
        owner: root
        group: docker
      when: docker_env_file.stat.exists

- name: Check for compose .env
  tags: docker, compose, env
  delegate_to: localhost
  become: false
  stat:
    path: "{{ role_path }}/files/{{ inventory_hostname }}/docker_env/compose_env"
  register: docker_compose_env_file
  when: app is undefined

- name: Copy compose .env
  tags: docker, compose, env
  copy:
    src: "{{ inventory_hostname }}/docker_env/compose_env"
    dest: "{{ compose_dir }}/.env"
    mode: "0440"
    owner: root
    group: docker
  when:
    - app is undefined
    - docker_compose_env_file.stat.exists

- name: Pull docker services
  tags: docker, compose, pull
  shell:
    chdir: "{{ compose_dir }}"
    executable: /usr/bin/zsh
    cmd: set -o pipefail; docker compose $(find {{ compose_dir }} -maxdepth 1 -name '*.yml' | sed -e "s/^/-f /") pull
  register: docker_result
  # these "changed_when" conditions aren't quite working yet
  changed_when: "'Pull complete' in docker_result.stdout"

- name: Start docker services
  tags: docker, compose, up
  shell:
    chdir: "{{ compose_dir }}"
    executable: /usr/bin/zsh
    cmd: set -o pipefail; docker compose $(find {{ compose_dir }} -maxdepth 1 -name '*.yml' | sed -e "s/^/-f /") up -d --remove-orphans
  register: docker_result
  changed_when: "'Started' in docker_result.stdout"

- name: Prune docker services
  tags: docker, compose,  up
  command:
    cmd: docker system prune -f
  changed_when: false
