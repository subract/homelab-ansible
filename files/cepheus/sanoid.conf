[rpool]
  use_template = prod
  recursive = yes

# Exclude docker (manages its own snapshots) from snapshots
[rpool/var/lib/docker]
  autosnap = no
  autoprune = no

# No snapshots on bpool, as they cause it to fill too quickly

[template_prod]
  autosnap = yes
  autoprune = yes
  frequently = 0
  hourly = 4
  daily = 7
  monthly = 6
  yearly = 0
