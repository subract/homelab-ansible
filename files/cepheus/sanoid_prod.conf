[rpool]
  use_template = prod
  # Using `recursive = zfs` makes the snapshots consistent, but precludes using `process_children_only`
  recursive = zfs

# No spapshots on bpool, as they cause it to fill too quickly

[template_prod]
  autosnap = yes
  autoprune = yes
  frequently = 4
  hourly = 4
  daily = 7
  monthly = 6
  yearly = 0
