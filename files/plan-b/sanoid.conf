[hdd/pit]
  use_template = pit
  recursive = yes

[hdd/backups]
  use_template = backups
  recursive = yes

# Backups will be coming in with a ton of snapshots already
# so we don't need or want to create new ones, just prune
# the existing ones
[template_backups]
  autosnap = no
  autoprune = yes
  frequently = 0
  hourly = 0
  daily = 14
  monthly = 12
  yearly = 0

# The pit changes slowly, but we should snapshot it occasionally
[template_pit]
  autosnap = yes
  autoprune = yes
  frequently = 0
  hourly = 0
  daily = 7
  monthly = 6
  yearly = 0
